name: signing-lab

# Disposable end-to-end rehearsal of the QMdmm distro signing scheme:
#   root key signs the keyring source; one sign-only subkey per distro line
#   signs that line's day-to-day source; consumers get everything from Pages.
#
# Five stages, run in order:
#
#   A pack     build the real packages with the harness's own pack script, once
#              per (line, version), inside that row's distribution image.
#   S sign     build and sign that row's repository. Format-level: what comes
#              out is a signed repository, and which program reads it is a
#              separate concern, handled below.
#   publish    assemble the site and push it to the gh-pages branch. Pages
#              serves that branch, so the published layout IS the repository
#              layout: <pages>/<line>/<version> is a repository root a consumer
#              can put straight into sources.list / baseurl / pacman.conf.
#   B consume  one consumer per row, inside a clean distribution container,
#              holding no secret: takes the public keys from Pages, configures
#              the repository, installs the runtime package - and then asserts
#              that holding ONLY the root key would not have been enough.
#   C taint    tamper with one metadata file in a local copy of a published
#              repository and prove the same consumer refuses it. One cell per
#              (format, consumer) pair, with the untouched copy as a control.
#
# Only A and S declare an environment: that is what makes a line's subkey
# secret visible. publish declares none, and neither do B or C - which is
# exactly a consumer's position, not a rehearsal of it.
#
# Why nothing here runs on push: a run is twelve real Qt 6 builds followed by
# twelve more containers. Starting that on every push to a repository that is
# still being iterated on is not worth it, so the whole pipeline hangs off
# workflow_dispatch and is started deliberately.
on:
  workflow_dispatch:
    inputs:
      # Stage A packages whatever ref it is handed, the same way the harness's
      # own workflow does. `git fetch --depth 1` resolves a branch or tag name or
      # a full object name and nothing else, so a short SHA is not usable here.
      qmdmm_ref:
        description: 'QMdmm ref (branch, tag, or full 40-char SHA) to package'
        required: false
        default: 'main'
        type: string
      build_type:
        description: 'CMake build type'
        required: false
        default: 'Release'
        type: choice
        options: [Release, MinSizeRel, Debug]

permissions:
  contents: write            # publish pushes the gh-pages branch

env:
  # The root key does not rotate, so pinning its fingerprint here is fine.
  # Each line's *subkey* is deliberately NOT listed: B and S discover it from
  # the key file they just fetched, so rotating a subkey never requires editing
  # this workflow.
  ROOT_FPR: DB05E5D9027139A493E7C9DDCD290DDA2AE83D38
  LAB_PAGES: https://nemn9852.github.io/qmdmm-signing-lab

jobs:

  # ================================================================= stage A
  # The real thing: the harness's own pack script, cloned from
  # QMdmm/QMdmmPackagingCi, run inside each row's distribution image. Nothing
  # here signs anything - that is stage S, and keeping them apart is what lets a
  # package be built once and signed once per row rather than per consumer.
  stage-a-pack:
    name: "A pack (${{ matrix.line }} ${{ matrix.version }})"
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { line: debian,  fmt: deb, consumer: apt,    version: trixie,   image: "debian:trixie",            expect: "-6 -6-dev -common-dev -doc" }
          - { line: debian,  fmt: deb, consumer: apt,    version: forky,    image: "debian:forky",             expect: "-6 -6-dev -common-dev -doc" }
          - { line: debian,  fmt: deb, consumer: apt,    version: sid,      image: "debian:sid",               expect: "-6 -6-dev -common-dev -doc" }
          - { line: ubuntu,  fmt: deb, consumer: apt,    version: resolute, image: "ubuntu:resolute",          expect: "-6 -6-dev -common-dev -doc" }
          - { line: ubuntu,  fmt: deb, consumer: apt,    version: stonking, image: "ubuntu:stonking",          expect: "-6 -6-dev -common-dev -doc" }
          - { line: fedora,  fmt: rpm, consumer: dnf,    version: 44,       image: "fedora:44",                expect: "-6 -6-devel -common-devel -doc" }
          - { line: fedora,  fmt: rpm, consumer: dnf,    version: 45,       image: "fedora:45",                expect: "-6 -6-devel -common-devel -doc" }
          - { line: fedora,  fmt: rpm, consumer: dnf,    version: rawhide,  image: "fedora:rawhide",           expect: "-6 -6-devel -common-devel -doc" }
          - { line: rocky,   fmt: rpm, consumer: dnf,    version: 10,       image: "rockylinux/rockylinux:10", expect: "-6 -6-devel -common-devel -doc" }
          - { line: alma,    fmt: rpm, consumer: dnf,    version: 10,       image: "almalinux:10",             expect: "-6 -6-devel -common-devel -doc" }
          - { line: arch,    fmt: pac, consumer: pacman, version: rolling,  image: "archlinux:base",           expect: "-6" }
          - { line: manjaro, fmt: pac, consumer: pacman, version: rolling,  image: "manjarolinux/base:latest", expect: "-6" }
    steps:
      # The harness, fetched without needing git *inside* the container - these
      # images do not ship git, and stage A is what installs it. actions/checkout
      # downloads a tarball over the REST API instead of cloning, so it works
      # before any package has been installed. (A `git clone` here failed with
      # "git: not found" on every row.)
      - uses: actions/checkout@v7
        with:
          repository: QMdmm/QMdmmPackagingCi
          path: harness
      - name: Pack with the harness
        working-directory: harness
        env:
          QMDMM_REPO: https://github.com/QMdmm/QMdmm.git
          QMDMM_REF: ${{ github.event.inputs.qmdmm_ref || 'main' }}
          QMDMM_BUILD_TYPE: ${{ github.event.inputs.build_type || 'Release' }}
          DIST_EXPECT: ${{ matrix.expect }}
        run: bash ci/pack-${{ matrix.fmt }}.sh
      - name: Collect what was produced
        working-directory: harness
        run: |
          set -euo pipefail
          echo "--- out/ ---"
          ls -l out/ | sed 's/^/  /'
          echo "--- MANIFEST.tsv ---"
          sed 's/^/  /' out/MANIFEST.tsv
      - uses: actions/upload-artifact@v7
        with:
          name: pack-${{ matrix.line }}-${{ matrix.version }}
          path: harness/out/
          if-no-files-found: error

  # ===================== the revocation fixtures =====================
  # Material for the two formats the debian line cannot speak for: a repository
  # signed by a key that has since been revoked. FINDINGS 3.1 says revocation is
  # only as good as the verifier, and 10.8 said this lab had demonstrated it
  # against gpgv and measured nothing for dnf or pacman. This is the measurement.
  #
  # Built here rather than committed, because the signature has to be made with
  # the key BEFORE it is revoked - gpg refuses to sign with a revoked key - and
  # the private half lives only in the `fixture` environment. What IS committed
  # is the two public states of that same key, so one artifact can be made to
  # produce two verdicts.
  stage-a-revoked-fixture:
    name: "A fixture (repository signed by a revoked key, ${{ matrix.fmt }})"
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    environment: fixture
    strategy:
      fail-fast: false
      matrix:
        include:
          - { fmt: rpm, image: "fedora:44" }
          - { fmt: pac, image: "archlinux:base" }
    steps:
      - uses: actions/checkout@v7
      - name: Build a repository signed by the revoked fixture key
        env:
          SIGNING_KEY_B64: ${{ secrets.SIGNING_KEY }}
          OUT: ${{ github.workspace }}/fixture
        run: bash "$PWD/lab/mkrepo-revoked-${{ matrix.fmt }}.sh"
      - uses: actions/upload-artifact@v7
        with:
          name: revoked-${{ matrix.fmt }}
          path: fixture
          if-no-files-found: error

  # ================================================================= stage S
  # Sign what stage A produced, once per row, in the row's own image and with
  # that row's subkey. Format-level: this produces a signed repository, and the
  # consumer that later reads it is a separate concern (stages B and C).
  #
  # The root-signed keyring source is not here on purpose - the root secret never
  # enters CI, so that half stays a trusted-machine step. What runs here holds
  # exactly one subkey and asserts it cannot sign as the root.
  stage-s-sign:
    name: "S sign (${{ matrix.line }} ${{ matrix.version }})"
    needs: [stage-a-pack]
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    environment: ${{ matrix.line }}          # <- only this makes SIGNING_KEY visible
    strategy:
      fail-fast: false
      matrix:
        include:
          - { line: debian,  fmt: deb, version: trixie,   image: "debian:trixie" }
          - { line: debian,  fmt: deb, version: forky,    image: "debian:forky" }
          - { line: debian,  fmt: deb, version: sid,      image: "debian:sid" }
          - { line: ubuntu,  fmt: deb, version: resolute, image: "ubuntu:resolute" }
          - { line: ubuntu,  fmt: deb, version: stonking, image: "ubuntu:stonking" }
          - { line: fedora,  fmt: rpm, version: 44,       image: "fedora:44" }
          - { line: fedora,  fmt: rpm, version: 45,       image: "fedora:45" }
          - { line: fedora,  fmt: rpm, version: rawhide,  image: "fedora:rawhide" }
          - { line: rocky,   fmt: rpm, version: 10,       image: "rockylinux/rockylinux:10" }
          - { line: alma,    fmt: rpm, version: 10,       image: "almalinux:10" }
          - { line: arch,    fmt: pac, version: rolling,  image: "archlinux:base" }
          - { line: manjaro, fmt: pac, version: rolling,  image: "manjarolinux/base:latest" }
    steps:
      - uses: actions/checkout@v7
      - name: Fetch the packages stage A built
        uses: actions/download-artifact@v8
        with:
          name: pack-${{ matrix.line }}-${{ matrix.version }}
          path: pkgs
      - name: Sign the repository
        env:
          SIGNING_KEY_B64: ${{ secrets.SIGNING_KEY }}
          PKGS: ${{ github.workspace }}/pkgs
          OUT: ${{ github.workspace }}/repo
          LINE: ${{ matrix.line }}
          # The apt suite is the row's version name; the rpm and pacman scripts
          # have no use for it.
          SUITE: ${{ matrix.version }}
        run: bash "$PWD/lab/sign-repo-${{ matrix.fmt }}.sh"
      - uses: actions/upload-artifact@v7
        with:
          name: repo-${{ matrix.line }}-${{ matrix.version }}
          path: repo
          if-no-files-found: error

  # ================================================================= publish
  # Collect what stage S signed and put it on gh-pages, at the path a consumer
  # will point at. The collection walks the artifact names rather than a list of
  # lines: a hard-coded list is what silently dropped every stage-S artifact
  # when the artifact naming moved from per-line to per-(line, version).
  publish:
    name: "publish"
    needs: [stage-s-sign, stage-a-revoked-fixture]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Assemble the site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -r site/. _site/                     # built off-CI, staged at its published path
          mkdir -p _site/keys && cp -r keys/. _site/keys/

          shopt -s nullglob
          n=0
          for d in artifacts/repo-*; do
            name="${d#artifacts/repo-}"
            line="${name%%-*}"; ver="${name#*-}"
            # repo-<line>-<version>, and both parts must be present: a name with
            # no dash would otherwise publish itself to a path that hides the bug.
            if [ -z "$line" ] || [ -z "$ver" ] || [ "$line" = "$ver" ]; then
              echo "!! cannot read a line/version out of '$name'"; exit 1
            fi
            rm -rf "_site/$line/$ver"
            mkdir -p "_site/$line/$ver"
            cp -r "$d/." "_site/$line/$ver/"
            echo "  $name -> $line/$ver  ($(find "$d" -type f | wc -l | tr -d ' ') files)"
            n=$((n+1))
          done
          echo "  $n signed repository/repositories staged"
          [ "$n" -ge 1 ] || { echo "!! no stage-S artifact to publish"; exit 1; }

          # The revocation fixtures keep their names: they are not rows in the
          # matrix, so there is no line/version to read out of them.
          for d in artifacts/revoked-*; do
            name="${d#artifacts/}"
            rm -rf "_site/$name"; mkdir -p "_site/$name"
            cp -r "$d/." "_site/$name/"
            echo "  $name -> $name  ($(find "$d" -type f | wc -l | tr -d ' ') files)"
          done

          {
            echo '<!doctype html><meta charset="utf-8">'
            echo '<title>QMdmm signing lab</title>'
            echo '<h1>QMdmm signing lab</h1>'
            echo '<p>A disposable end-to-end test of the QMdmm distro signing scheme.'
            echo 'These are test keys and are revoked when the lab ends.</p>'
            echo '<h2>Fingerprints</h2><pre>'
            sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' keys/fingerprints.txt
            echo '</pre><h2>Repository roots</h2><ul>'
            for dir in $(cd _site && find . -mindepth 2 -maxdepth 2 -type d | sed 's|^\./||' | sort); do
              echo "<li><a href=\"$dir/\">$dir/</a></li>"
            done
            for dir in debian-keyring debian-revoked revoked-rpm revoked-pac; do
              [ -d "_site/$dir" ] && echo "<li><a href=\"$dir/\">$dir/</a> (built off-CI)</li>"
            done
            echo '</ul><h2>Tree</h2><pre>'
            (cd _site && find . -type f | sort | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g')
            echo '</pre>'
          } > _site/index.html
          # Consumers wait on this: a branch deploy is async, so "push returned"
          # does not mean "Pages is serving the new content".
          printf '{"sha":"%s","run":"%s","at":"%s"}\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$(date -u +%FT%TZ)" > _site/publish.json
          cat _site/publish.json
          echo "--- site contents ---"
          (cd _site && find . -type f | sort)
      - name: Publish to the gh-pages branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git init -q _pub && cd _pub
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin gh-pages 2>/dev/null; then
            git checkout -q -B gh-pages FETCH_HEAD
          else
            git checkout -q --orphan gh-pages
          fi
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r ../_site/. .
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to publish"
          else
            git -c user.name="Neve M. Nguyen" -c user.email="nemn9852@agent.qq.com" \
                commit -q -m "publish ${GITHUB_SHA:0:7}"
            git push -q origin gh-pages
            echo "pushed gh-pages"
          fi
      - name: Wait for Pages to actually serve it
        env:
          PAGES: ${{ env.LAB_PAGES }}
        run: |
          set -euo pipefail
          # A branch deploy is asynchronous, and the CDN in front of Pages can
          # keep answering with the previous deploy for a while afterwards.
          # Waiting here - once - is cheaper and more honest than making every
          # consumer cell wait on its own: they start only after Pages is
          # serving the site this run built, and a stubborn CDN fails one job
          # with a clear message instead of seventeen.
          for i in $(seq 1 120); do
            raw=$(curl -fsSL --max-time 15 \
                        -H 'Cache-Control: no-cache' -H 'Pragma: no-cache' \
                        "$PAGES/publish.json?cb=${RANDOM}${RANDOM}" 2>/dev/null || true)
            got=$(printf '%s' "$raw" | tr -d ' \n' | sed -n 's/.*"sha":"\([0-9a-f]*\)".*/\1/p')
            if [ "$got" = "$GITHUB_SHA" ]; then
              echo "Pages is serving ${got:0:7} (after $i poll(s))"
              exit 0
            fi
            echo "Pages still serves ${got:-nothing} - waiting"
            sleep 10
          done
          echo "!! Pages never served ${GITHUB_SHA:0:7}"; exit 1

  # ================================================================= stage B
  # The consumer half, one cell per row: same twelve (line, version) pairs, but
  # in a clean container with no environment declared, so it holds no secret.
  # Each script is named after the program that reads the format (apt, dnf,
  # pacman), and each one asserts both halves - that its own line's key works,
  # and that the root key alone would not have been enough.
  #
  # The keys come from Pages and nowhere else, so this is what a real consumer
  # of the published repository can do and nothing more.
  stage-b-consume:
    name: "B consume (${{ matrix.line }} ${{ matrix.version }}, ${{ matrix.consumer }})"
    needs: [publish]
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { line: debian,  fmt: deb, consumer: apt,    version: trixie,   image: "debian:trixie" }
          - { line: debian,  fmt: deb, consumer: apt,    version: forky,    image: "debian:forky" }
          - { line: debian,  fmt: deb, consumer: apt,    version: sid,      image: "debian:sid" }
          - { line: ubuntu,  fmt: deb, consumer: apt,    version: resolute, image: "ubuntu:resolute" }
          - { line: ubuntu,  fmt: deb, consumer: apt,    version: stonking, image: "ubuntu:stonking" }
          - { line: fedora,  fmt: rpm, consumer: dnf,    version: 44,       image: "fedora:44" }
          - { line: fedora,  fmt: rpm, consumer: dnf,    version: 45,       image: "fedora:45" }
          - { line: fedora,  fmt: rpm, consumer: dnf,    version: rawhide,  image: "fedora:rawhide" }
          - { line: rocky,   fmt: rpm, consumer: dnf,    version: 10,       image: "rockylinux/rockylinux:10" }
          - { line: alma,    fmt: rpm, consumer: dnf,    version: 10,       image: "almalinux:10" }
          - { line: arch,    fmt: pac, consumer: pacman, version: rolling,  image: "archlinux:base" }
          - { line: manjaro, fmt: pac, consumer: pacman, version: rolling,  image: "manjarolinux/base:latest" }
    steps:
      - uses: actions/checkout@v7
      - name: Confirm no secret is reachable (a consumer's position)
        env:
          LEAK_CHECK: ${{ secrets.SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${LEAK_CHECK:-}" ]; then
            echo "!! secret visible without declaring an environment"; exit 1
          fi
          echo "OK: this job sees no secret (same position as a consumer)"
      - name: Fetch what stage A recorded, to check the site serves it
        uses: actions/download-artifact@v8
        with:
          name: pack-${{ matrix.line }}-${{ matrix.version }}
          path: pkgs
      - name: Consume the published repository
        env:
          PAGES: ${{ env.LAB_PAGES }}
          ROOT_FPR: ${{ env.ROOT_FPR }}
          EXPECT_SHA: ${{ github.sha }}
          LINE: ${{ matrix.line }}
          VERSION: ${{ matrix.version }}
          PKGS: ${{ github.workspace }}/pkgs
        run: bash "$PWD/lab/consume-${{ matrix.consumer }}.sh"

  # ===================== stage B, the half that is built off-CI ==============
  # One cell, not twelve. The root-signed keyring source and the revoked-subkey
  # fixture are produced on a trusted machine - the root secret never enters a
  # workflow - so there is exactly one of each, whatever the line count is.
  #
  # This cell is what keeps "only the root key may sign the keyring source" and
  # "a revoked subkey stops being trusted" from being claims with nobody
  # checking them. The second assertion reads gpg's status stream rather than
  # its exit code, because the exit code does not change for a revoked signer
  # (FINDINGS.md 3.1).
  stage-b-keyring:
    name: "B keyring (root-signed source + revoked fixture)"
    needs: [publish]
    runs-on: ubuntu-latest
    container:
      image: "debian:sid"
    steps:
      - uses: actions/checkout@v7
      - name: Confirm no secret is reachable (a consumer's position)
        env:
          LEAK_CHECK: ${{ secrets.SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${LEAK_CHECK:-}" ]; then
            echo "!! secret visible without declaring an environment"; exit 1
          fi
          echo "OK: this job sees no secret (same position as a consumer)"
      - name: Check the off-CI sources
        env:
          PAGES: ${{ env.LAB_PAGES }}
          ROOT_FPR: ${{ env.ROOT_FPR }}
          EXPECT_SHA: ${{ github.sha }}
        run: bash "$PWD/lab/consume-apt-keyring.sh"

  # ============ the other half of the trust bootstrap, and the half a user
  # actually meets: the keyring source ships exactly one package, and installing
  # it is supposed to leave both repositories configured and working. Nothing
  # else in this workflow installs it, so without this cell the claim "install
  # the package and you are set up" has no witness at all (FINDINGS 10.8).
  stage-b-keyring-package:
    name: "B keyring package (install it, then use only what it configured)"
    needs: [publish]
    runs-on: ubuntu-latest
    container:
      image: "debian:sid"
    steps:
      - uses: actions/checkout@v7
      - name: Confirm no secret is reachable (a consumer's position)
        env:
          LEAK_CHECK: ${{ secrets.SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${LEAK_CHECK:-}" ]; then
            echo "!! secret visible without declaring an environment"; exit 1
          fi
          echo "OK: this job sees no secret (same position as a consumer)"
      - name: Install the keyring package and use only what it configured
        env:
          PAGES: ${{ env.LAB_PAGES }}
          ROOT_FPR: ${{ env.ROOT_FPR }}
          EXPECT_SHA: ${{ github.sha }}
        run: bash "$PWD/lab/consume-keyring-package.sh"

  # ============ and the measurement FINDINGS 3.1 asked for: does this consumer
  # refuse a key that has since been revoked? One cell per format the debian line
  # could not speak for, each comparing ONE artifact under the two public states
  # of the same signing key - the tightest form of the control 3.7 asks for,
  # where the only difference between the accepted and rejected halves is what
  # the consumer was handed.
  stage-b-revoked:
    name: "B revoked (${{ matrix.consumer }})"
    needs: [publish]
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { fmt: rpm, consumer: dnf,    image: "fedora:44" }
          - { fmt: pac, consumer: pacman, image: "archlinux:base" }
    steps:
      - uses: actions/checkout@v7
      - name: Confirm no secret is reachable (a consumer's position)
        env:
          LEAK_CHECK: ${{ secrets.SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${LEAK_CHECK:-}" ]; then
            echo "!! secret visible without declaring an environment"; exit 1
          fi
          echo "OK: this job sees no secret (same position as a consumer)"
      - name: Check what revocation does to this consumer
        env:
          PAGES: ${{ env.LAB_PAGES }}
          EXPECT_SHA: ${{ github.sha }}
        run: bash "$PWD/lab/consume-revoked-${{ matrix.consumer }}.sh"

  # ================================================================= stage C
  # Tamper with one metadata file in a local copy of a published repository and
  # prove the consumer refuses it. One cell per (format, consumer) pair: the
  # file layout is format-level, the refusal is consumer-level, and rpm alone
  # has two consumers here (dnf4 on EL, dnf5 on fedora) that do not share a
  # verification implementation.
  #
  # Each run first checks the UNTAMPERED copy against the same consumer, so a
  # failure later cannot be blamed on the harness instead of on the tampering.
  stage-c-taint:
    name: "C taint (${{ matrix.line }} ${{ matrix.version }}, ${{ matrix.consumer }})"
    needs: [publish]
    runs-on: ubuntu-latest
    container:
      image: ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { line: debian, fmt: deb, consumer: apt,    version: sid,     image: "debian:sid" }
          - { line: fedora, fmt: rpm, consumer: dnf5,   version: 44,      image: "fedora:44" }
          - { line: rocky,  fmt: rpm, consumer: dnf4,   version: 10,      image: "rockylinux/rockylinux:10" }
          - { line: arch,   fmt: pac, consumer: pacman, version: rolling, image: "archlinux:base" }
    steps:
      - uses: actions/checkout@v7
      - name: Confirm no secret is reachable (a consumer's position)
        env:
          LEAK_CHECK: ${{ secrets.SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${LEAK_CHECK:-}" ]; then
            echo "!! secret visible without declaring an environment"; exit 1
          fi
          echo "OK: this job sees no secret (same position as a consumer)"
      - name: Tamper with a published repository
        env:
          PAGES: ${{ env.LAB_PAGES }}
          ROOT_FPR: ${{ env.ROOT_FPR }}
          EXPECT_SHA: ${{ github.sha }}
          LINE: ${{ matrix.line }}
          VERSION: ${{ matrix.version }}
          FMT: ${{ matrix.fmt }}
        run: bash "$PWD/lab/taint-repo.sh"

  # ============ the one probe worth keeping: a release matrix is a list of
  # container tags, and a tag that does not resolve is a red job on the first
  # run for no reason (`rockylinux:10` was exactly that - the real name is
  # rockylinux/rockylinux:10). Checks them all at once, before anything is built
  # on them, using `docker manifest inspect` so nothing gets downloaded.
  probe-matrix-tags:
    name: "probe matrix tags"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check every container tag issue #24 names resolves
        run: bash "$PWD/lab/probe-matrix-tags.sh"
