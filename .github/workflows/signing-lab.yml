name: signing-lab

# Disposable end-to-end rehearsal of the QMdmm distro signing scheme:
#   root key signs the keyring source; one sign-only subkey per distro line
#   signs that line's day-to-day source; consumers get everything from Pages.
#
# Job split, and the point of it:
#   sign-*   declare an environment, so they receive that line's subkey secret.
#            The actual signing runs inside the distro's own container, so the
#            toolchain under test is the real one.
#   publish  collects public keys + both sources and pushes them to Pages.
#   verify-* deliberately declare NO environment: they hold no secret at all,
#            which is exactly a consumer's position. They fetch public keys
#            from Pages and try to install/accept.
on:
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

env:
  ROOT_FPR: DB05E5D9027139A493E7C9DDCD290DDA2AE83D38
  SUB_DEBIAN: 22F94DB1069D1F24505CB5675779CAB6443DA554
  SUB_FEDORA: 0CB6055FE24FCC8BEEFB6D99808EB86A8399B375
  SUB_ARCH: 1D569E0B4281AA59A13217B0B7681D0609159052
  LAB_PAGES: https://nemn9852.github.io/qmdmm-signing-lab

jobs:

  # ===================== signing side: one container per distro =====================

  sign-debian:
    runs-on: ubuntu-latest
    environment: debian                     # <- only this makes SIGNING_KEY visible
    steps:
      - uses: actions/checkout@v7
      - name: Probe whether stdin can be piped into a container here
        run: |
          set -euo pipefail
          printf 'probe-payload\n' | docker run --rm -i debian:sid \
            bash -c 'IFS= read -r X || true; echo "container received: [$X]"'
      - name: Sign the day-to-day source inside debian:sid
        env:
          SIGNING_KEY_B64: ${{ secrets.SIGNING_KEY }}
        run: |
          set -euo pipefail
          mkdir -p out/debian
          docker run --rm \
            -v "$PWD:/w" -w /w \
            -e SIGNING_KEY_B64="$SIGNING_KEY_B64" \
            -e SUB_FPR="$SUB_DEBIAN" \
            debian:sid bash /w/lab/sign-debian.sh
          sudo chmod -R a+rX out
      - uses: actions/upload-artifact@v7
        with:
          name: repo-debian
          path: out/debian
          if-no-files-found: error

  sign-fedora:
    runs-on: ubuntu-latest
    environment: fedora
    steps:
      - uses: actions/checkout@v7
      - name: Sign the day-to-day source inside fedora:latest
        env:
          SIGNING_KEY_B64: ${{ secrets.SIGNING_KEY }}
        run: |
          set -euo pipefail
          mkdir -p out/fedora
          docker run --rm \
            -v "$PWD:/w" -w /w \
            -e SIGNING_KEY_B64="$SIGNING_KEY_B64" \
            -e SUB_FPR="$SUB_FEDORA" \
            fedora:latest bash /w/lab/sign-fedora.sh
          sudo chmod -R a+rX out
      - uses: actions/upload-artifact@v7
        with:
          name: repo-fedora
          path: out/fedora
          if-no-files-found: error

  sign-arch:
    runs-on: ubuntu-latest
    environment: arch
    steps:
      - uses: actions/checkout@v7
      - name: Sign the day-to-day source inside archlinux:base
        env:
          SIGNING_KEY_B64: ${{ secrets.SIGNING_KEY }}
        run: |
          set -euo pipefail
          mkdir -p out/arch
          docker run --rm \
            -v "$PWD:/w" -w /w \
            -e SIGNING_KEY_B64="$SIGNING_KEY_B64" \
            -e SUB_FPR="$SUB_ARCH" \
            archlinux:base bash /w/lab/sign-arch.sh
          sudo chmod -R a+rX out
      - uses: actions/upload-artifact@v7
        with:
          name: repo-arch
          path: out/arch
          if-no-files-found: error

  # ===================== publish: keys + both sources on Pages =====================

  publish:
    runs-on: ubuntu-latest
    needs: [sign-debian, sign-fedora, sign-arch]
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Assemble the site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -r keys _site/keys
          cp -r repo _site/repo
          for d in debian fedora arch; do
            src="artifacts/repo-$d"
            [ -d "$src" ] || continue
            rm -rf "_site/repo/$d/daily"
            mkdir -p "_site/repo/$d"
            if [ -d "$src/daily" ]; then
              cp -r "$src/daily" "_site/repo/$d/daily"
            else
              cp -r "$src/." "_site/repo/$d/daily"
            fi
          done
          {
            echo '<!doctype html><meta charset="utf-8">'
            echo '<title>QMdmm signing lab</title>'
            echo '<h1>QMdmm signing lab</h1>'
            echo '<p>A disposable end-to-end test of the QMdmm distro signing scheme.'
            echo 'These are test keys and are revoked when the lab ends.</p>'
            echo '<h2>Fingerprints</h2><pre>'
            sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' keys/fingerprints.txt
            echo '</pre><h2>Tree</h2><pre>'
            (cd _site && find . -type f | sort | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g')
            echo '</pre>'
          } > _site/index.html
          echo "--- site contents ---"
          (cd _site && find . -type f | sort)
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v5

  # ===================== consumer side: no environment, no secret =====================

  verify-debian:
    runs-on: ubuntu-latest
    needs: [publish]
    steps:
      - uses: actions/checkout@v7
      - name: Confirm no secret is reachable (a consumer's position)
        env:
          LEAK_CHECK: ${{ secrets.SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${LEAK_CHECK:-}" ]; then
            echo "!! secret visible without declaring an environment - premise does not hold"; exit 1
          fi
          echo "OK: verify job sees no secret (same position as a consumer)"
      - name: Verify inside a clean debian:sid
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/w" -w /w \
            -e LAB_PAGES="$LAB_PAGES" \
            -e ROOT_FPR="$ROOT_FPR" -e SUB_FPR="$SUB_DEBIAN" \
            debian:sid bash /w/lab/verify-debian.sh

  verify-fedora:
    runs-on: ubuntu-latest
    needs: [publish]
    steps:
      - uses: actions/checkout@v7
      - name: Confirm no secret is reachable (a consumer's position)
        env:
          LEAK_CHECK: ${{ secrets.SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${LEAK_CHECK:-}" ]; then
            echo "!! secret visible without declaring an environment"; exit 1
          fi
          echo "OK: verify job sees no secret (same position as a consumer)"
      - name: Verify inside a clean fedora:latest
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/w" -w /w \
            -e LAB_PAGES="$LAB_PAGES" \
            -e ROOT_FPR="$ROOT_FPR" -e SUB_FPR="$SUB_FEDORA" \
            fedora:latest bash /w/lab/verify-fedora.sh

  verify-arch:
    runs-on: ubuntu-latest
    needs: [publish]
    steps:
      - uses: actions/checkout@v7
      - name: Confirm no secret is reachable (a consumer's position)
        env:
          LEAK_CHECK: ${{ secrets.SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${LEAK_CHECK:-}" ]; then
            echo "!! secret visible without declaring an environment"; exit 1
          fi
          echo "OK: verify job sees no secret (same position as a consumer)"
      - name: Verify inside a clean archlinux:base
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/w" -w /w \
            -e LAB_PAGES="$LAB_PAGES" \
            -e ROOT_FPR="$ROOT_FPR" -e SUB_FPR="$SUB_ARCH" \
            archlinux:base bash /w/lab/verify-arch.sh
