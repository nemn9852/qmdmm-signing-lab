name: signing-lab

# Disposable end-to-end rehearsal of the QMdmm distro signing scheme:
#   root key signs the keyring source; one sign-only subkey per distro line
#   signs that line's day-to-day source; consumers get everything from Pages.
#
# Job split, and the point of it:
#   sign-*   declare an environment, so they receive that line's subkey secret.
#            The actual signing runs inside the distro's own container, so the
#            toolchain under test is the real one.
#   publish  assembles the site and pushes it to the gh-pages branch. Pages
#            serves that branch, so the published layout IS the repository
#            layout: <pages>/<distro> is a repository root a consumer can put
#            straight into sources.list / baseurl.
#   verify-* deliberately declare NO environment: they hold no secret at all,
#            which is exactly a consumer's position.
on:
  workflow_dispatch: {}
  push:
    branches: [main]

permissions:
  contents: write            # publish pushes the gh-pages branch

env:
  # The root key does not rotate, so pinning its fingerprint here is fine.
  # Each line's *subkey* is deliberately NOT listed: sign scripts discover it
  # from the keyring they just imported, so rotating a subkey never requires
  # editing this workflow.
  ROOT_FPR: DB05E5D9027139A493E7C9DDCD290DDA2AE83D38
  LAB_PAGES: https://nemn9852.github.io/qmdmm-signing-lab

jobs:

  # ===================== signing side: one container per line =====================

  sign-debian:
    runs-on: ubuntu-latest
    environment: debian                     # <- only this makes SIGNING_KEY visible
    steps:
      - uses: actions/checkout@v7
      - name: Sign the day-to-day source inside debian:sid
        env:
          SIGNING_KEY_B64: ${{ secrets.SIGNING_KEY }}
        run: |
          set -euo pipefail
          mkdir -p out/debian
          docker run --rm \
            -v "$PWD:/w" -w /w \
            -e SIGNING_KEY_B64="$SIGNING_KEY_B64" \
            -e OUT=/w/out/debian -e SUITE=sid \
            debian:sid bash /w/lab/sign-debian.sh
          sudo chmod -R a+rX out
      - uses: actions/upload-artifact@v7
        with:
          name: repo-debian
          path: out/debian
          if-no-files-found: error

  sign-rpm:
    name: sign-rpm (${{ matrix.line }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { line: fedora, image: "fedora:43",     env: fedora }
          - { line: rocky,  image: "rockylinux/rockylinux:10", env: rocky  }
          - { line: alma,   image: "almalinux:10",  env: alma   }
    environment: ${{ matrix.env }}
    steps:
      - uses: actions/checkout@v7
      - name: Sign the day-to-day source inside ${{ matrix.image }}
        env:
          SIGNING_KEY_B64: ${{ secrets.SIGNING_KEY }}
        run: |
          set -euo pipefail
          mkdir -p "out/${{ matrix.line }}"
          docker run --rm \
            -v "$PWD:/w" -w /w \
            -e SIGNING_KEY_B64="$SIGNING_KEY_B64" \
            -e OUT="/w/out/${{ matrix.line }}" \
            -e LINE="${{ matrix.line }}" \
            "${{ matrix.image }}" bash /w/lab/sign-rpm.sh
          sudo chmod -R a+rX out
      - uses: actions/upload-artifact@v7
        with:
          name: repo-${{ matrix.line }}
          path: out/${{ matrix.line }}
          if-no-files-found: error

  sign-arch:
    runs-on: ubuntu-latest
    environment: arch
    steps:
      - uses: actions/checkout@v7
      - name: Sign the day-to-day source inside archlinux:base
        env:
          SIGNING_KEY_B64: ${{ secrets.SIGNING_KEY }}
        run: |
          set -euo pipefail
          mkdir -p out/arch
          docker run --rm \
            -v "$PWD:/w" -w /w \
            -e SIGNING_KEY_B64="$SIGNING_KEY_B64" \
            -e OUT=/w/out/arch -e LINE=arch \
            archlinux:base bash /w/lab/sign-arch.sh
          sudo chmod -R a+rX out
      - uses: actions/upload-artifact@v7
        with:
          name: repo-arch
          path: out/arch
          if-no-files-found: error

  # ===================== publish: assemble and push gh-pages =====================

  publish:
    runs-on: ubuntu-latest
    needs: [sign-debian, sign-rpm, sign-arch]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
      - name: Assemble the site
        run: |
          set -euo pipefail
          mkdir -p _site
          cp -r site/. _site/                     # locally signed material
          mkdir -p _site/keys && cp -r keys/. _site/keys/
          for d in debian fedora rocky alma arch; do
            src="artifacts/repo-$d"
            [ -d "$src" ] || continue
            rm -rf "_site/$d"; mkdir -p "_site/$d"
            cp -r "$src/." "_site/$d/"
          done
          {
            echo '<!doctype html><meta charset="utf-8">'
            echo '<title>QMdmm signing lab</title>'
            echo '<h1>QMdmm signing lab</h1>'
            echo '<p>A disposable end-to-end test of the QMdmm distro signing scheme.'
            echo 'These are test keys and are revoked when the lab ends.</p>'
            echo '<h2>Fingerprints</h2><pre>'
            sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g' keys/fingerprints.txt
            echo '</pre><h2>Repository roots</h2><ul>'
            for d in debian debian-keyring debian-revoked fedora rocky alma arch; do
              [ -d "_site/$d" ] && echo "<li><a href=\"$d/\">$d/</a></li>"
            done
            echo '</ul><h2>Tree</h2><pre>'
            (cd _site && find . -type f | sort | sed -e 's/&/\&amp;/g' -e 's/</\&lt;/g')
            echo '</pre>'
          } > _site/index.html
          # Verify jobs wait on this: a branch deploy is async, so "push
          # returned" does not mean "Pages is serving the new content".
          printf '{"sha":"%s","run":"%s","at":"%s"}\n' \
            "$GITHUB_SHA" "$GITHUB_RUN_ID" "$(date -u +%FT%TZ)" > _site/publish.json
          cat _site/publish.json
          echo "--- site contents ---"
          (cd _site && find . -type f | sort)
      - name: Publish to the gh-pages branch
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git init -q _pub && cd _pub
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth 1 origin gh-pages 2>/dev/null; then
            git checkout -q -B gh-pages FETCH_HEAD
          else
            git checkout -q --orphan gh-pages
          fi
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r ../_site/. .
          git add -A
          if git diff --cached --quiet; then
            echo "no changes to publish"
          else
            git -c user.name="Neve M. Nguyen" -c user.email="nemn9852@agent.qq.com" \
                commit -q -m "publish ${GITHUB_SHA:0:7}"
            git push -q origin gh-pages
            echo "pushed gh-pages"
          fi

  # ===================== consumer side: no environment, no secret =====================

  verify-debian:
    runs-on: ubuntu-latest
    needs: [publish]
    steps:
      - uses: actions/checkout@v7
      - name: Confirm no secret is reachable (a consumer's position)
        env:
          LEAK_CHECK: ${{ secrets.SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${LEAK_CHECK:-}" ]; then
            echo "!! secret visible without declaring an environment"; exit 1
          fi
          echo "OK: verify job sees no secret (same position as a consumer)"
      - name: Verify inside a clean debian:sid
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/w" -w /w \
            -e LAB_PAGES="$LAB_PAGES" -e ROOT_FPR="$ROOT_FPR" \
            -e EXPECT_SHA="${{ github.sha }}" \
            -e LINE=debian -e SUITE=sid \
            debian:sid bash /w/lab/verify-debian.sh

  verify-rpm:
    name: verify-rpm (${{ matrix.line }})
    runs-on: ubuntu-latest
    needs: [publish]
    strategy:
      fail-fast: false
      matrix:
        include:
          # fedora:43 is rpm 6.0.2 / dnf5 5.2.18, which rejects repomd.xml signed
          # by any gpg key (all six shapes probed - see FINDINGS.md 4.1). The
          # assertion is inverted there so the job does not stay red and train
          # everyone to ignore it: a later FAILURE means the limitation is gone
          # and the flag should be dropped.
          - { line: fedora, image: "fedora:43",                expect_metadata_rejected: "1" }
          - { line: rocky,  image: "rockylinux/rockylinux:10" }
          - { line: alma,   image: "almalinux:10"  }
    steps:
      - uses: actions/checkout@v7
      - name: Confirm no secret is reachable (a consumer's position)
        env:
          LEAK_CHECK: ${{ secrets.SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${LEAK_CHECK:-}" ]; then
            echo "!! secret visible without declaring an environment"; exit 1
          fi
          echo "OK: verify job sees no secret (same position as a consumer)"
      - name: Verify inside a clean ${{ matrix.image }}
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/w" -w /w \
            -e LAB_PAGES="$LAB_PAGES" -e ROOT_FPR="$ROOT_FPR" \
            -e EXPECT_SHA="${{ github.sha }}" \
            -e LINE="${{ matrix.line }}" \
            -e EXPECT_METADATA_REJECTED="${{ matrix.expect_metadata_rejected || '0' }}" \
            "${{ matrix.image }}" bash /w/lab/verify-rpm.sh

  verify-arch:
    runs-on: ubuntu-latest
    needs: [publish]
    steps:
      - uses: actions/checkout@v7
      - name: Confirm no secret is reachable (a consumer's position)
        env:
          LEAK_CHECK: ${{ secrets.SIGNING_KEY }}
        run: |
          set -euo pipefail
          if [ -n "${LEAK_CHECK:-}" ]; then
            echo "!! secret visible without declaring an environment"; exit 1
          fi
          echo "OK: verify job sees no secret (same position as a consumer)"
      - name: Verify inside a clean archlinux:base
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/w" -w /w \
            -e LAB_PAGES="$LAB_PAGES" -e ROOT_FPR="$ROOT_FPR" \
            -e EXPECT_SHA="${{ github.sha }}" \
            -e LINE=arch \
            archlinux:base bash /w/lab/verify-arch.sh

  # ============ one-off probe (dispatch only): which key type does a given
  # rpm/dnf actually accept for repository metadata? Written after fedora:43
  # (rpm 6 / dnf5) rejected a signature that rocky:10 and alma:10 accepted.
  #   A. subkey signed   B. primary signed   -> A fail + B pass means the
  #   problem is subkeys, not the algorithm.
  probe-rpm-signature:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { line: fedora43, image: "fedora:43",                algo: ed25519 }
          - { line: fedora43, image: "fedora:43",                algo: rsa4096 }
          - { line: rocky10,  image: "rockylinux/rockylinux:10", algo: ed25519 }
          - { line: rocky10,  image: "rockylinux/rockylinux:10", algo: rsa4096 }
    steps:
      - uses: actions/checkout@v7
      - name: Probe ${{ matrix.image }} with ${{ matrix.algo }}
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/w" -w /w \
            -e LINE="${{ matrix.line }}" -e ALGO="${{ matrix.algo }}" \
            "${{ matrix.image }}" bash /w/lab/probe-rpm-signature.sh

  # Follow-up: since the failure is neither the algorithm nor the subkey, how
  # does this distro obtain the key from gpgkey= at all?
  probe-rpm-keyimport:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { line: fedora43, image: "fedora:43",                algo: ed25519 }
          - { line: fedora43, image: "fedora:43",                algo: rsa4096 }
          - { line: rocky10,  image: "rockylinux/rockylinux:10", algo: ed25519 }
          - { line: rocky10,  image: "rockylinux/rockylinux:10", algo: rsa4096 }
    steps:
      - uses: actions/checkout@v7
      - name: Probe key import on ${{ matrix.image }} (${{ matrix.algo }})
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/w" -w /w \
            -e LINE="${{ matrix.line }}" -e ALGO="${{ matrix.algo }}" \
            "${{ matrix.image }}" bash /w/lab/probe-rpm-keyimport.sh

  # Third probe: the key DOES land in dnf5's per-repo keyring and verification
  # still fails, so isolate which property of the key/signature it objects to.
  probe-rpm-verify:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { line: fedora43, image: "fedora:43",                algo: ed25519 }
          - { line: fedora43, image: "fedora:43",                algo: rsa4096 }
          - { line: rocky10,  image: "rockylinux/rockylinux:10", algo: ed25519 }
    steps:
      - uses: actions/checkout@v7
      - name: Probe what dnf needs to accept repomd.xml on ${{ matrix.image }}
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/w" -w /w \
            -e LINE="${{ matrix.line }}" -e ALGO="${{ matrix.algo }}" \
            "${{ matrix.image }}" bash /w/lab/probe-rpm-verify.sh

  # Fourth probe: repo_gpgcheck is dead on fedora:43 for every key shape, so
  # check whether the package-level path still works there - which is also the
  # direct answer to the old 'EdDSA signs fine, installs badly' question.
  probe-rpm-pkgcheck:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - { line: fedora43, image: "fedora:43",                algo: ed25519 }
          - { line: fedora43, image: "fedora:43",                algo: rsa4096 }
          - { line: rocky10,  image: "rockylinux/rockylinux:10", algo: ed25519 }
    steps:
      - uses: actions/checkout@v7
      - name: Probe package-level signing on ${{ matrix.image }} (${{ matrix.algo }})
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/w" -w /w \
            -e LINE="${{ matrix.line }}" -e ALGO="${{ matrix.algo }}" \
            "${{ matrix.image }}" bash /w/lab/probe-rpm-pkgcheck.sh

  # Positive control for the one inverted assertion: run verify-rpm.sh with the
  # flag set against a distro where metadata verification DOES work. It must go
  # red, and for the documented reason - otherwise the flag is a blanket green.
  probe-inversion-control:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    needs: [publish]
    steps:
      - uses: actions/checkout@v7
      - name: Prove the inverted assertion can fail
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD:/w" -w /w \
            -e LAB_PAGES="$LAB_PAGES" \
            -e EXPECT_SHA="${{ github.sha }}" \
            rockylinux/rockylinux:10 bash /w/lab/probe-inversion-control.sh
